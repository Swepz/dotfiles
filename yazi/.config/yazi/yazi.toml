[opener]
open = [
	{ run = "/usr/bin/xdg-open %s1", desc = "Open", for = "linux", orphan = true },
]
play = [
	{ run = "/usr/bin/xdg-open %s1", desc = "Play", for = "linux", orphan = true },
	{ run = "mediainfo %s1; echo 'Press enter to exit'; read _", block = true, desc = "Show media info", for = "unix" },
]
reveal = [
	{ run = "/usr/bin/xdg-open %d1", desc = "Reveal", for = "linux", orphan = true },
]
