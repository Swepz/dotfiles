---
- name: Set sddm as display manager
  become: true
  ansible.builtin.file:
    src: /usr/lib/systemd/system/sddm.service
    dest: /etc/systemd/system/display-manager.service
    state: link
    force: true

- name: Reload systemd after display manager change
  become: true
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start system services
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ enabled_services }}"

- name: Enable user services
  become: false
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    scope: user
  loop: "{{ enabled_user_services }}"

- name: Ensure systemd logind drop-in directory exists
  tags: [lid_switch]
  become: true
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure lid-close handling
  tags: [lid_switch]
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/90-dotfiles-lid-switch.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Login]
      HandleLidSwitch=suspend
      HandleLidSwitchExternalPower=suspend
      HandleLidSwitchDocked=ignore
  register: lid_switch_config

- name: Reload logind after lid-close change
  tags: [lid_switch]
  become: true
  ansible.builtin.systemd:
    name: systemd-logind
    state: reloaded
  when: lid_switch_config.changed

- name: Ensure systemd sleep drop-in directory exists
  become: true
  ansible.builtin.file:
    path: /etc/systemd/sleep.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Use freeze backend for systemd suspend
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/sleep.conf.d/90-dotfiles-suspend-freeze.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Sleep]
      SuspendState=freeze

