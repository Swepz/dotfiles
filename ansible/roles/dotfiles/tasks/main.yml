---
- name: Clone dotfiles repository
  ansible.builtin.git:
    repo: "{{ dotfiles_repo }}"
    dest: "{{ dotfiles_dest }}"
    version: main
    update: false
  become: false

- name: Ensure ~/.config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.config"
    state: directory
    mode: "0755"
  become: false

- name: Stow dotfile packages
  ansible.builtin.command:
    cmd: "stow --dir={{ dotfiles_dest }} --target={{ ansible_facts.env.HOME }} --verbose=2 -R {{ item }}"
  loop: "{{ stow_packages }}"
  become: false
  register: stow_result
  changed_when: "'LINK: ' in stow_result.stderr"

- name: Install DankMaterialShell plugins from the lockfile
  ansible.builtin.command:
    cmd: "dms plugins restore {{ ansible_facts.env.HOME }}/.config/DankMaterialShell/plugins.lock.json"
  become: false

- name: Seed monitor configuration
  ansible.builtin.copy:
    content: |
      hl.monitor({ output = "", mode = "preferred", position = "auto", scale = 1 })
    dest: "{{ ansible_facts.env.HOME }}/.config/hypr/monitors.lua"
    force: false
    mode: "0644"
  become: false

- name: Ensure DankMaterialShell Hyprland include directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.config/hypr/dms"
    state: directory
    mode: "0755"
  become: false

- name: Seed DankMaterialShell Hyprland includes
  ansible.builtin.copy:
    content: ""
    dest: "{{ ansible_facts.env.HOME }}/.config/hypr/dms/{{ item }}.lua"
    force: false
    mode: "0644"
  loop:
    - binds
    - binds-user
    - colors
    - layout
  become: false
