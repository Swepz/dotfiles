set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:extkeys:hyperlinks:usstyle,xterm-256color:RGB:extkeys:hyperlinks"
set -s extended-keys on
set -s escape-time 0
set -s set-clipboard on
set -g allow-passthrough on
set -g focus-events on
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

unbind C-b
set -g prefix C-a
bind a send-prefix

bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r n next-window
bind -r p previous-window
bind x kill-pane
bind X kill-window
bind T command-prompt -I "#W" "rename-window '%%'"
bind q detach-client
bind R source-file ~/.config/tmux/tmux.conf \; display "reloaded"

bind r switch-client -T resize
bind -T resize h resize-pane -L 3 \; switch-client -T resize
bind -T resize j resize-pane -D 3 \; switch-client -T resize
bind -T resize k resize-pane -U 3 \; switch-client -T resize
bind -T resize l resize-pane -R 3 \; switch-client -T resize

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

set -g status-style "fg=default,bg=default"
set -g status-left " #S "
set -g status-right " %H:%M #h "
set -g window-status-current-style "fg=blue,bold"
set -g pane-active-border-style "fg=blue"
set -g pane-border-style "fg=brightblack"
set -g mode-style "fg=black,bg=yellow"
