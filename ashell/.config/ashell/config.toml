log_level = "warn"
#outputs = { Targets = ["eDP-1"] }
position = "Top"
# Force metric units (°C, km/h) + English date names; overrides en_US locale for the bar only
region = "en_GB.UTF-8"

[modules]
left = [["appLauncher", "Updates", "Workspaces"]]
center = ["WindowTitle"]
right = [["MediaPlayer", "Tray", "SystemInfo", "Tempo", "Privacy", "CustomNotifications", "Settings"]]

[updates]
check_cmd = "checkupdates; yay -Qua"
update_cmd = 'alacritty -e bash -c "yay; echo Done - Press enter to exit; read" &'
interval = 3600

[workspaces]
visibility_mode = "All"
group_by_monitor = false
enable_workspace_filling = true

[[CustomModule]]
name = "appLauncher"
icon = "󱗼"
command = "~/.config/hypr/scripts/launcher.sh"

[[CustomModule]]
name = "Recording"
type = "Button"
icon = "●"
command = "~/.config/hypr/scripts/toggle-record.sh"
listen_cmd = "~/.config/ashell/recording.sh"
alert = "recording"
icons.'recording' = "■"

[[CustomModule]]
name = "CustomNotifications"
type = "Button"
icon = "󰂚"
command = "swaync-client -t -sw"
listen_cmd = "~/.config/ashell/notifications.sh"
icons.'dnd.*' = "󰂛"
alert = ".*notification"

[window_title]
mode = "Title"
truncate_title_after_length = 60

[media_player]
indicator_format = "Icon"
max_title_length = 60

[system_info]
indicators = ["Cpu", "Memory", "Temperature"]
interval = 2

[system_info.cpu]
warn_threshold = 60
alert_threshold = 80

[system_info.memory]
warn_threshold = 70
alert_threshold = 85

[system_info.temperature]
warn_threshold = 60
alert_threshold = 80
sensor = "acpitz temp1"

[tempo]
clock_format = "%a %d %b %R"
# formats = [ "%a %d %b %R", "%Y-%m-%d %H:%M:%S", "%H:%M:%S" ]
# timezones = [ "UTC", "America/New_York", "Europe/London" ]
weather_location = { City = "Stockholm" }
# weather_location = { Coordinates = [40.7128, -74.0060] }
# weather_location = "Current"
weather_indicator = "IconAndTemperature"

[settings]
lock_cmd = "playerctl --all-players pause; hyprlock &"
audio_sinks_more_cmd = "pavucontrol -t 3"
audio_sources_more_cmd = "pavucontrol -t 4"
wifi_more_cmd = "nm-connection-editor"
vpn_more_cmd = "nm-connection-editor"
bluetooth_more_cmd = "blueman-manager"
battery_format = "IconAndPercentage"
peripheral_battery_format = "Icon"
audio_indicator_format = "Icon"
microphone_indicator_format = "Icon"
network_indicator_format = "Icon"
bluetooth_indicator_format = "Icon"
brightness_indicator_format = "Icon"
indicators = [
  "IdleInhibitor",
  "PowerProfile",
  "Audio",
  "Microphone",
  "Bluetooth",
  "Network",
  "Vpn",
  "Battery",
  "Brightness",
]

[[settings.CustomButton]]
name = "Walk Mode"
icon = "󰌢"
command = "~/.config/ashell/walk-mode.sh toggle"
status_command = "~/.config/ashell/walk-mode.sh status"

[appearance]
scale_factor = 1.25
style = "Solid"
opacity = 0.8

primary_color = "#36f9f6"
success_color = "#72f1b8"
text_color = "#f8f8f2"
workspace_colors = ["#36f9f6", "#ff7edb"]
special_workspace_colors = ["#c792ea", "#fede5d"]

[appearance.danger_color]
base = "#fe4450"
weak = "#ff8b39"

[appearance.background_color]
base = "#262335"
weak = "#2a2440"
strong = "#463465"

[appearance.secondary_color]
base = "#1a1626"
